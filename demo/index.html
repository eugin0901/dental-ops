<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체험판 · 치과 운영 관리</title>
<meta name="theme-color" content="#10232a">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="치과운영">
<script src="config.js"></script>
<script src="qr.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 데스크 PC에 하루 종일 띄워 두는 차분한 업무 도구
   IDEA: 치과 데스크의 운영판(화이트보드) - 오늘 챙길 것만 크게, 나머지는 탭 안에
   PICTURE: 홈의 '오늘 챙길 일' 알림판과 월별 KPI 막대, 각 탭은 바로 쓰는 표
   COLOUR and TYPE: 딥 틸 #0b4f5c, 흰 바탕, 산호 #ff6a4d 경고 / IBM Plex Sans KR + Noto Sans KR
   LAYOUT: 상단 띠(이름+탭), 본문 1240px, 모바일은 탭 가로 스크롤과 카드형 표 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c1416);--ink:light-dark(#10232a,#e6f0f2);--mute:light-dark(#5a6e74,#93a9ae);
--deep:light-dark(#0b4f5c,#0f3a43);--zone:light-dark(#eef6f7,#13242a);--line:light-dark(#d7e5e8,#24393f);
--acc:#ff6a4d;--accbg:light-dark(#fff0ec,#3a1d17);--ok:light-dark(#0b7a6a,#4fd1b8);--okbg:light-dark(#e3f4f0,#12302b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;margin:0;line-height:1.2;text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto}
header{background:var(--deep);color:#fff;padding:18px max(5vw,16px) 0}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
header h1{font-size:clamp(22px,3vw,30px)}
.mode{font-size:13px;opacity:.8}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:14px;scrollbar-width:none}
nav a{flex:none;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px 10px 0 0;font-weight:500;font-size:15px;opacity:.78;min-height:44px;display:flex;align-items:center;gap:6px}
nav a.on{background:var(--bg);color:var(--ink);opacity:1}
nav a:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
nav .dot{background:var(--acc);color:#fff;border-radius:10px;font-size:12px;padding:0 6px;line-height:18px}
main{padding:24px max(5vw,16px) 56px}
.head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:16px}
.head h2{font-size:clamp(24px,3vw,32px)}
.head p{margin:4px 0 0;color:var(--mute);font-size:14.5px;max-width:70ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{font:16px "Noto Sans KR",sans-serif;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px;width:100%}
textarea{min-height:160px;line-height:1.6}
.bar input{width:200px;flex:1 1 160px}
button{font:500 15px "Noto Sans KR",sans-serif;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--zone);color:var(--ink);cursor:pointer;min-height:44px}
button.pri{background:var(--deep);color:#fff;border-color:var(--deep)}
button.del{color:var(--acc);border-color:var(--acc);background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:500;color:var(--mute);font-size:13.5px;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--zone)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td small{display:block;color:var(--mute);font-size:13px}
.nw{white-space:nowrap}
.b{display:inline-block;font-size:13px;font-weight:500;padding:2px 9px;border-radius:20px;white-space:nowrap;background:var(--zone);color:var(--mute)}
.b.w{background:var(--accbg);color:var(--acc)}.b.o{background:var(--okbg);color:var(--ok)}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{min-height:36px;min-width:36px;padding:0;font-size:18px;line-height:1}
.empty{padding:36px 20px;text-align:center;color:var(--mute);background:var(--zone);border-radius:14px}
.empty button{margin-top:12px}
.sec{margin-top:36px}.sec h3{font-size:20px;margin-bottom:10px}
.privacy{font-size:13.5px;color:var(--mute);margin:0 0 14px}
/* home */
.board{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.alerts{display:grid;gap:10px}
.al{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--zone);cursor:pointer;border:2px solid transparent;text-align:left;width:100%;color:inherit;font:inherit}
.al:hover{border-color:var(--line)}
.al .big{font:700 34px/1 "IBM Plex Sans KR",sans-serif;text-align:center;color:var(--ok)}
.al.w{background:var(--accbg)}.al.w .big{color:var(--acc)}
.al b{display:block;font-size:16px}.al span{font-size:14px;color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi{background:var(--zone);border-radius:14px;padding:18px}
.kpi h3{font-size:18px}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.kgrid div{background:var(--bg);border-radius:10px;padding:10px 12px}
.kgrid small{display:block;color:var(--mute);font-size:13px}
.kgrid strong{font:700 22px "IBM Plex Sans KR",sans-serif;white-space:nowrap}
.kgrid em{font-style:normal;font-size:13px;margin-left:4px}
.up{color:var(--ok)}.dn{color:var(--acc)}
.chart{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:20px;border-bottom:1px solid var(--line)}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart i{display:block;width:100%;max-width:44px;background:var(--deep);border-radius:6px 6px 0 0;min-height:2px;transition:height .4s}
.chart div:last-child i{background:var(--acc)}
.chart span{font-size:12px;color:var(--mute);white-space:nowrap}
.chart b{font-size:12px;font-weight:500;white-space:nowrap}
.xl{display:flex;gap:6px}.xl span{flex:1;text-align:center;font-size:12px;color:var(--mute);white-space:nowrap;padding-top:4px}
/* checklist */
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:8px;margin-bottom:8px}
.checks label{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;min-height:48px}
.checks input{width:22px;height:22px;min-height:0;accent-color:var(--ok);flex:none}
.checks label.on{background:var(--okbg)}
/* manuals */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h3{font-size:18px;margin:6px 0 8px}
.card pre{white-space:pre-wrap;font:15px/1.65 "Noto Sans KR",sans-serif;margin:0;max-height:220px;overflow:auto}
.card .bar{margin-top:12px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(5,20,24,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:9;overflow:auto}
.ov.on{display:flex}
.md{background:var(--bg);border-radius:16px;padding:22px;width:min(560px,100%)}
.md h3{font-size:21px;margin-bottom:14px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.fg .full{grid-column:1/-1}
.md .bar{margin-top:18px;justify-content:space-between}
.lo{min-height:32px;padding:3px 10px;font-size:13px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
[hidden]{display:none!important}
#gate{padding:8vh max(5vw,16px);display:grid;place-items:center}
.gatebox{max-width:440px;width:100%;text-align:center;background:var(--zone);border-radius:18px;padding:36px 28px}
.gatebox h2{font-size:26px;margin-bottom:10px}.gatebox p{color:var(--mute);margin:0 0 22px}.gatebox p b{color:var(--ink)}
.kakao{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:320px;background:#FEE500;color:rgba(0,0,0,.85);border:0;border-radius:12px;font-weight:700;font-size:16px;min-height:52px}
.gmsg{margin-top:14px!important;color:var(--acc)!important;font-size:14px}
.users tbody tr{cursor:default}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;display:none;z-index:10;max-width:90vw}
.toast.on{display:block}
.sdot{font-style:normal;font-size:12px;background:var(--acc);color:#fff;border-radius:10px;padding:0 6px;line-height:18px;margin-left:4px}
.card.task .route{margin:0 0 8px;font-size:15px}.card.task .reply{margin:10px 0 0;padding:8px 12px;background:var(--zone);border-radius:10px;font-size:14.5px}
.card.task .meta{margin:8px 0 0;font-size:13px;color:var(--mute)}
.card.task.late{border-color:var(--acc)}.card.task.done{opacity:.65}
.priv{grid-column:1/-1;border:2px dashed var(--acc);border-radius:12px;padding:12px 14px 14px;margin:16px 0 0}
.priv legend{font-weight:700;color:var(--acc);padding:0 6px}.priv>p{margin:0 0 10px;font-size:13.5px;color:var(--mute)}
.photo{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);gap:14px;align-items:start;background:var(--zone);border-radius:12px;padding:12px}
.phbox{display:grid;gap:6px}.phbox img{width:100%;max-height:220px;object-fit:contain;border-radius:8px;background:var(--bg)}.phbox a{font-size:13px;color:var(--ok)}
.phctl{display:grid;gap:8px;justify-items:start}.phctl p{margin:0;font-size:14px;color:var(--mute)}
label.btn{display:inline-flex;align-items:center;justify-content:center;font:500 15px "Noto Sans KR",sans-serif;padding:9px 16px;border-radius:10px;min-height:44px;cursor:pointer;color:var(--ink);background:var(--bg);border:1px solid var(--line)}
label.btn.pri{background:var(--deep);color:#fff;border-color:var(--deep)}
input.filled,select.filled{background:light-dark(#fff8d6,#3a3414);border-color:#e0b400}
@media(max-width:600px){.photo{grid-template-columns:minmax(0,1fr)}}
a.tel{color:var(--ok);text-decoration:none;font-variant-numeric:tabular-nums}a.tel:hover{text-decoration:underline}
.role{font:500 16px "Noto Sans KR",sans-serif;color:var(--mute)}
.sdgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.sdc{border:1px solid var(--line);border-radius:14px;padding:14px 16px}.sdc.adm{border:2px dashed var(--acc)}.sdc.adm h3{color:var(--acc)}
.sdh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.sdh h3{font-size:19px}
.lvbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lvbar small{display:block;color:var(--mute);font-size:13px}.lvbar strong{font:700 24px "IBM Plex Sans KR",sans-serif}.lvbar .warn{color:var(--acc)}
.meter{height:8px;background:var(--zone);border-radius:4px;overflow:hidden;margin:8px 0 12px}.meter i{display:block;height:100%;background:var(--deep)}
.sdl{list-style:none;margin:0;padding:0}.sdl li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer}.sdl li:hover{background:var(--zone)}
.docs{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.docs h4{margin:0 0 8px;font-size:16px}.docs h4 small{color:var(--mute);font-weight:400}
.sdl.dl li{cursor:default}.sdl.dl a{color:var(--ink);font-weight:500;word-break:break-all}.sdl.dl a:hover{color:var(--ok)}
.docup{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.docup select{width:auto}.docup .none{margin:0;font-size:13px}
button.x.arm{color:var(--acc);font-size:13px;min-width:44px}
.sdl.ed li{grid-template-columns:minmax(0,1fr) auto auto}
.sdl li small{display:block;color:var(--mute);font-size:12.5px}
.sdc dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}.sdc dt{color:var(--mute);font-size:14px}.sdc dd{margin:0}
.pm{white-space:pre-wrap;background:var(--zone);border-radius:10px;padding:10px 12px;margin:12px 0 0;font-size:15px}
.myhead h2{font-size:clamp(24px,3.4vw,32px)}.myhead p{margin:4px 0 16px;color:var(--mute)}
.mygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.mycard{border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:8px;align-content:start}.mycard h3{font-size:17px;display:flex;align-items:center;gap:8px}
.mycard.wide{grid-column:1/-1}.mycard.today{background:var(--zone);border-color:transparent}
.mycard .big{font:700 30px "IBM Plex Sans KR",sans-serif;margin:0}.mycard .big small{font-size:16px;font-weight:500;color:var(--mute)}.mycard p{margin:0}
.cnt{background:var(--acc);color:#fff;border-radius:12px;font-size:13px;padding:0 8px;line-height:22px}
.myl{list-style:none;margin:0;padding:0}.myl li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.myl li b{display:block}.myl small{display:block;color:var(--mute);font-size:13px}
.clip{display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.myl button{flex:none}
.punchrow button{flex:1}
.myweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.myweek div{background:var(--zone);border-radius:10px;padding:8px 4px;text-align:center}.myweek small{display:block;color:var(--mute);font-size:12px}.myweek b{font-size:14px}.myweek .on{background:var(--okbg)}.myweek .td{outline:2px solid var(--acc)}
.more{font-size:14px;color:var(--ok);text-decoration:none}
.confirm{background:var(--zone);border-radius:14px;padding:16px;display:grid;gap:6px;justify-items:start}.confirm .big{font:700 24px "IBM Plex Sans KR",sans-serif}
.picklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.picklist button{display:grid;gap:2px;min-height:60px}.picklist small{font-size:12px;opacity:.8}
.myfoot{margin-top:18px;font-size:14px;color:var(--mute)}.myfoot a{color:var(--ok)}
.linkbtn{background:none;border:0;padding:0;min-height:0;color:var(--mute);text-decoration:underline;font-size:14px}
.stages{display:grid;gap:8px}.stage{display:grid;gap:2px;text-align:left;padding:10px 14px;background:var(--bg)}.stage small{color:var(--mute);font-size:13px;font-weight:400}.stage.on{border:2px solid var(--deep);background:var(--zone)}
.nokpi{grid-template-columns:minmax(0,1fr)!important}.nokpi .kpi{display:none}
.gatebox.wide{max-width:760px}.ob{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;text-align:left;margin:6px 0 16px}.ob section{background:var(--bg);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start}.ob h3{font-size:18px}.ob p{margin:0!important;font-size:14px}
#ob-code{font:700 22px "IBM Plex Sans KR",sans-serif;letter-spacing:.2em;text-transform:uppercase;text-align:center}
.adgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;align-items:start}
.code{font:700 40px "IBM Plex Sans KR",sans-serif;letter-spacing:.25em;color:var(--deep);background:var(--zone);border-radius:12px;text-align:center;padding:10px;margin:10px 0}
:root[data-theme=dark] .code{color:#9fd9e3}
pre.invite{white-space:pre-wrap;font:14px/1.6 "Noto Sans KR",sans-serif;background:var(--zone);border-radius:10px;padding:10px 12px;margin:0 0 10px;color:var(--mute)}
.fld{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.toggles label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;cursor:pointer}.toggles input{width:20px;height:20px;min-height:0;accent-color:var(--ok)}
.fbl li{cursor:default}
.fab{position:fixed;right:16px;bottom:16px;z-index:8;border-radius:24px;background:var(--acc);color:#fff;border:0;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:10px 18px}
@media(max-width:600px){.ob{grid-template-columns:minmax(0,1fr)}.code{font-size:32px}.fab{right:12px;bottom:12px;padding:8px 14px;font-size:14px}}
.rsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 14px}.rsum div{background:var(--zone);border-radius:12px;padding:12px 14px}.rsum small{display:block;color:var(--mute);font-size:13px}.rsum strong{font:700 22px "IBM Plex Sans KR",sans-serif}.rsum strong.sm{font-size:15px;line-height:1.5}
@media(max-width:600px){.rsum{grid-template-columns:minmax(0,1fr)}}
.picker{background:var(--zone);border-radius:14px;padding:14px 16px;margin:0 0 16px}.picker>p{margin:0 0 10px;color:var(--mute);font-size:14.5px}
.picker fieldset{border:0;padding:0;margin:0 0 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:6px}.picker legend{font-weight:700;margin-bottom:6px;padding:0}
.picker label{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;min-height:44px}
.picker label input{width:20px;height:20px;min-height:0;flex:none;margin-top:2px;accent-color:var(--ok)}.picker label small{display:block;color:var(--mute);font-size:12.5px}.picker label.had{opacity:.55}
.mgr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 16px;background:var(--zone);border-radius:14px;padding:12px}
.mgr label{display:grid;gap:4px;font-size:14px}.mgr label>span:first-child{font-weight:700}.mgr small{color:var(--mute);font-size:12.5px}
.od{display:flex;align-items:center;gap:6px}.od input{width:76px}
.osec{margin:18px 0}.osec h3{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:19px;margin-bottom:6px}.osec h3 small{font:500 14px "Noto Sans KR",sans-serif;color:var(--mute)}.osec h3 span{margin-left:auto;font-size:16px;white-space:nowrap}
.otbl{min-width:820px}.otbl td{padding:6px 6px}.otbl input{min-height:38px;padding:5px 8px;font-size:15px}.otbl input.num{width:96px;text-align:right}.otbl tbody tr{cursor:default}.otbl tbody tr:hover{background:transparent}
.otbl td small{display:block}
button.x{min-height:36px;min-width:36px;padding:0;font-size:20px;line-height:1;background:transparent;color:var(--mute)}
.none{color:var(--mute);font-size:14.5px;margin:4px 0}
.notice{background:var(--accbg);border-radius:12px;padding:10px 14px;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.oadd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.oadd select,.oadd input{width:auto;flex:1 1 180px}.oadd span{color:var(--mute);font-size:14px}
.omemo{display:grid;gap:4px;font-size:14px;color:var(--mute);margin-top:14px}.omemo textarea{min-height:80px}
.obot{margin-top:16px;justify-content:space-between}

/* TODAY: 직원끼리 업무 전달 현황 */
function todayTaskBoard(){if(offk('task'))return '';const t=today(),md=d=>d?Number(d.slice(5,7))+'/'+Number(d.slice(8)):'';
  const open=D.task.filter(r=>r.status!=='완료'),wk=addD(t,-7),doneR=D.task.filter(r=>r.status==='완료'&&((r.doneOn||r.due||r.sent||'')>=wk)).sort((a,b)=>String(b.doneOn||b.due||'').localeCompare(String(a.doneOn||a.due||''))),doneT=doneR.filter(r=>r.doneOn===t);
  const late=open.filter(r=>r.due&&r.due<t),dueT=open.filter(r=>r.due===t);
  const rows=[...open].sort((a,b)=>(a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:0).concat(doneR);
  const row=r=>{const n=r.due?days(r.due):null,cls=r.status==='완료'?'done':n!==null&&n<0?'late':n===0?'today':'';
    return `<li class="ttr ${cls}" data-edit="task:${esc(r.id)}" tabindex="0"><div class="ttd"><b>${r.due?md(r.due):'기한 없음'}</b><small>${r.sent?md(r.sent)+' 보냄':''}</small>${r.status!=='완료'&&r.due?`<em>${n<0?Math.abs(n)+'일 지남':n===0?'오늘까지':'D-'+n}</em>`:''}</div>
     <div class="ttm"><small>${esc(r.from||'')} → <b>${esc(r.to||'')}</b>${r.pri==='급함'?' '+T('급함','w'):''}</small><span>${esc(r.title||'')}</span></div>
     <div class="tts">${r.status==='완료'?T('업무 완료','o')+(r.doneOn?`<small class="tdone">${md(r.doneOn)} 완료</small>`:''):T(r.status||'전달됨',r.status==='전달됨'?'w':'')}</div></li>`};
  return `<section class="ttb"><div class="tth"><div><small>TODAY</small><h3>업무 전달 현황</h3></div><span class="nw">${md(t)} ${'일월화수목금토'[new Date().getDay()]}요일</span></div>
   <div class="ttn"><div><small>진행 중</small><b>${open.length}</b></div><div><small>오늘까지</small><b class="${dueT.length?'w':''}">${dueT.length}</b></div><div><small>기한 지남</small><b class="${late.length?'r':''}">${late.length}</b></div><div><small>최근 완료</small><b>${doneR.length}</b></div></div>
   ${rows.length?`<ul class="ttl">${rows.map(row).join('')}</ul>`:'<p class="none" style="color:rgba(255,255,255,.75)">진행 중인 업무 전달이 없어요.</p>'}
   <a class="more" href="#task" style="color:#fff">공지·전달에서 업무 보내기</a></section>`}

let started=false,chan=null,SESSION=null;
async function enter(session){
  SESSION=session;
  if(!session){me=null;loginScreen();return}
  let {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!p){await sb.rpc('ensure_profile');({data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle())}
  me=p||{id:session.user.id,name:'',approved:false,clinic_id:null};MYUID=session.user.id;
  $('who').hidden=false;$('whoname').textContent=me.name||'';
  if(!me.clinic_id){CL=null;CLINIC=null;setTitle();onboardScreen();watch();return}
  if(CL!==me.clinic_id){CL=me.clinic_id;started=false;if(chan){sb.removeChannel(chan);chan=null}}
  const {data:c}=await sb.from('clinics').select('*').eq('id',CL).maybeSingle();CLINIC=c||{id:CL,name:'',settings:{}};setTitle();
  watch();
  if(!me.approved){pendingScreen();return}
  TABS=isAdmin()?[...BASE_TABS,['users','관리자 설정']]:BASE_TABS;
  showApp();setMode();
  if(!started){started=true;await loadAll();loadUsers()}
  route();checkItem();pushSync().catch(()=>{});autoIn();
}
let selfChan=null;
function watch(){
  if(!selfChan){selfChan=sb.channel('me').on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles',filter:`id=eq.${me.id}`},pl=>{const n=pl.new;if(!n)return;const was=me.approved,wc=me.clinic_id;me={...me,...n};if(was!==n.approved||wc!==n.clinic_id){started=false;enter(SESSION)}}).subscribe()}
  if(CL&&!chan){chan=sb.channel('clinic-'+CL)
    .on('postgres_changes',{event:'*',schema:'public',table:'profiles',filter:`clinic_id=eq.${CL}`},()=>loadUsers())
    .on('postgres_changes',{event:'*',schema:'public',table:'records',filter:`clinic_id=eq.${CL}`},applyChange)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'clinics',filter:`id=eq.${CL}`},pl=>{if(pl.new){CLINIC={...CLINIC,...pl.new};setTitle();if(started)render()}})
    .subscribe(st=>{if(st==='SUBSCRIBED'&&started)loadAll()})}
}
